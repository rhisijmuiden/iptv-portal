name: Release

# Push a tag like v1.2.0, or run this workflow by hand with a version, to
# build the binaries and publish a GitHub release. When run by hand, the tag
# is created on the selected branch. The release notes are generated from the
# merged pull requests; the admin panel shows them under Info.
#
# A version with a suffix such as v1.2.0-rc.1, v1.2.0-beta.1 or
# v1.2.0-alpha.1 is published as a pre-release: only portals on the "test"
# release channel are offered it, and the installers keep using the latest
# stable release.
#
# The Test release workflow calls this workflow after every merge to main,
# so new features reach the test channel without manual steps.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v1.2.0 (stable) or v1.2.0-rc.1 (pre-release)
        required: true
  workflow_call:
    inputs:
      version:
        description: Version to release
        required: true
        type: string
      ref:
        description: Commit to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Version must look like v1.2.0 or v1.2.0-rc.1, got '$VERSION'"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/rhisijmuiden/iptv-portal/internal/version.Version=${VERSION}" \
              -o dist/iptv-portal ./cmd/iptv-portal
            cp LICENSE dist/LICENSE
            tar -C dist -czf dist/iptv-portal_linux_${arch}.tar.gz iptv-portal LICENSE
            rm dist/iptv-portal dist/LICENSE
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            # Pre-releases never become the "latest" release on GitHub.
            args+=(--prerelease --latest=false)
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=(--verify-tag)
          else
            # Run by hand or by the Test release workflow: tag the built commit.
            args+=(--target "$(git rev-parse HEAD)")
          fi
          gh release create "$VERSION" dist/* "${args[@]}"
