{{define "content"}}
<section class="card narrow">
  <h1>{{.PortalName}}</h1>
  {{if .Usable}}
  <p>{{t "You have been invited. Choose a username and password for your IPTV player."}}</p>
  <form method="post" class="stack">
    <label>{{t "Username"}} <input name="username" value="{{.Username}}" pattern="[A-Za-z0-9._\-]{3,32}" autocomplete="username" autocapitalize="none" required autofocus>
      <small>{{t "3-32 characters: letters, digits, dot, dash or underscore."}}</small></label>
    <label>{{t "Password"}} <input type="password" name="password" autocomplete="new-password" minlength="6" maxlength="64" required>
      <small>{{t `6-64 characters, no spaces or / ? # % & \ " '. You will type it on your TV, so keep it simple to enter.`}}</small></label>
    <label>{{t "Repeat password"}} <input type="password" name="confirm" autocomplete="new-password" minlength="6" maxlength="64" required></label>
    {{if .MailOn}}
    <label>{{t "Email"}} <input type="email" name="email" value="{{.Email}}" autocomplete="email" placeholder="{{t "Optional"}}">
      <small>{{t "We email you your login details, so you have them at hand when setting up your TV."}}</small></label>
    {{end}}
    <button>{{t "Create account"}}</button>
  </form>
  {{else}}
  <p>{{t "This invitation is no longer valid. Ask the person who invited you for a new link."}}</p>
  {{end}}
</section>
{{end}}
