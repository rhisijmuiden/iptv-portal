{{define "content"}}
{{$u := .Data.User}}
<h1>{{.Title}}</h1>
<section class="card">
<form method="post" action="{{if $u.ID}}/users/{{$u.ID}}{{else}}/users/new{{end}}" class="stack">
  <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
  <div class="row">
    <label>Username <input name="username" value="{{$u.Username}}" pattern="[A-Za-z0-9._\-]{3,32}" autocomplete="off" required>
      <small>3-32 characters: letters, digits, dot, dash or underscore.</small></label>
    <label>{{if $u.ID}}New password{{else}}Password{{end}}
      <input name="password" autocomplete="new-password" minlength="6" maxlength="64" {{if not $u.ID}}required{{end}}>
      <small>{{if $u.ID}}Leave empty to keep the current password. {{end}}6-64 characters, no spaces or / ? # % &amp; \ " '</small></label>
  </div>
  <fieldset>
    <legend>Packages</legend>
    {{range .Data.Packages}}
    <label class="check"><input type="checkbox" name="package" value="{{.ID}}" {{if has $u.PackageIDs .ID}}checked{{end}}> {{.Name}}{{if .AllChannels}} <span class="muted">(all channels)</span>{{end}}</label>
    {{else}}
    <p class="muted">There are no packages yet. <a href="/packages/new">Create a package</a> to give this user channels.</p>
    {{end}}
  </fieldset>
  <div class="row">
    <label>Expires on <input type="date" name="expires" value="{{date $u.ExpiresAt}}"><small>Leave empty for no expiry.</small></label>
    <label>Note <input name="note" value="{{$u.Note}}" placeholder="For example who this account is for"></label>
  </div>
  <label class="check"><input type="checkbox" name="enabled" {{if $u.Enabled}}checked{{end}}> Enabled</label>
  <div class="buttons">
    <button>Save</button>
    <a class="button secondary" href="/users">Cancel</a>
  </div>
</form>
</section>
{{end}}
