<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.PortalName}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{if and .Session (not .Session.Admin.MustChangePassword)}}
<header class="top">
  <a class="brand" href="/">{{.PortalName}}</a>
  <nav>
    <a href="/" {{if eq .Nav "dashboard"}}class="active"{{end}}>Dashboard</a>
    <a href="/channels" {{if eq .Nav "channels"}}class="active"{{end}}>Channels</a>
    <a href="/categories" {{if eq .Nav "categories"}}class="active"{{end}}>Categories</a>
    <a href="/import" {{if eq .Nav "import"}}class="active"{{end}}>Import</a>
    <a href="/settings" {{if eq .Nav "settings"}}class="active"{{end}}>Settings</a>
  </nav>
  <div class="user">
    <a href="/password">{{.Session.Admin.Username}}</a>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.Session.CSRF}}"><button class="link">Log out</button></form>
  </div>
</header>
{{end}}
<main>
  {{if .Flash}}<p class="flash ok">{{.Flash}}</p>{{end}}
  {{if .Error}}<p class="flash err">{{.Error}}</p>{{end}}
  {{template "content" .}}
</main>
<footer>IPTV Portal {{version}}</footer>
</body>
</html>
