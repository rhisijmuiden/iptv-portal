{{define "content"}}
<div class="titlebar">
  <div>
    <h1>Categories</h1>
    <p class="subtitle">Groups of channels, shown as folders on the TV box. Lower order numbers come first.</p>
  </div>
</div>
<section class="card">
  <h2>New category</h2>
  <form method="post" action="/categories" class="inline">
    <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
    <input name="name" placeholder="For example North Holland" required>
    <input type="number" name="sort_order" value="0" title="Order" class="small">
    <button>{{icon "plus"}}Add</button>
  </form>
</section>
{{if .Data}}
<div class="card flush">
<table>
  <thead><tr><th>Name</th><th>Order</th><th>Channels</th><th></th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr>
    <td colspan="2">
      <form method="post" action="/categories" class="inline">
        <input type="hidden" name="csrf" value="{{$.Session.CSRF}}">
        <input type="hidden" name="id" value="{{.ID}}">
        <input name="name" value="{{.Name}}" required>
        <input type="number" name="sort_order" value="{{.SortOrder}}" class="small">
        <button class="secondary sm">Save</button>
      </form>
    </td>
    <td><a href="/channels?category={{.ID}}">{{.ChannelCount}}</a></td>
    <td class="actions">
      <form method="post" action="/categories/{{.ID}}/delete" onsubmit="return confirm('Delete this category? Its channels are kept.')">
        <input type="hidden" name="csrf" value="{{$.Session.CSRF}}">
        <button class="danger sm" title="Delete">{{icon "trash"}}<span class="label">Delete</span></button>
      </form>
    </td>
  </tr>
  {{end}}
  </tbody>
</table>
</div>
{{end}}
{{end}}
