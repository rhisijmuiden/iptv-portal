{{define "content"}}
<h1>Categorieën</h1>
<section class="card">
  <h2>Nieuwe categorie</h2>
  <form method="post" action="/categories" class="inline">
    <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
    <input name="name" placeholder="Bijvoorbeeld Noord-Holland" required>
    <input type="number" name="sort_order" value="0" title="Volgorde" class="small">
    <button>Toevoegen</button>
  </form>
</section>
{{if .Data}}
<div class="card flush">
<table>
  <thead><tr><th>Naam</th><th>Volgorde</th><th>Kanalen</th><th></th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr>
    <td colspan="2">
      <form method="post" action="/categories" class="inline">
        <input type="hidden" name="csrf" value="{{$.Session.CSRF}}">
        <input type="hidden" name="id" value="{{.ID}}">
        <input name="name" value="{{.Name}}" required>
        <input type="number" name="sort_order" value="{{.SortOrder}}" class="small">
        <button class="secondary">Opslaan</button>
      </form>
    </td>
    <td><a href="/channels?category={{.ID}}">{{.ChannelCount}}</a></td>
    <td class="actions">
      <form method="post" action="/categories/{{.ID}}/delete" onsubmit="return confirm('Categorie verwijderen? De kanalen blijven bestaan.')">
        <input type="hidden" name="csrf" value="{{$.Session.CSRF}}">
        <button class="link danger">Verwijderen</button>
      </form>
    </td>
  </tr>
  {{end}}
  </tbody>
</table>
</div>
{{end}}
{{end}}
