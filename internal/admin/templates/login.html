{{define "content"}}
<section class="card narrow">
  <img class="logo-icon big" src="{{base}}/static/brand/rhis-icon.svg" alt="RHIS">
  <h1>{{.PortalName}}</h1>
  <p class="muted">{{t "Log in to the admin panel."}}</p>
  {{if and .Data .Data.SSO}}
  <a class="button secondary sso" href="{{base}}/login/entra">
    <svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
    {{t "Sign in with Microsoft"}}
  </a>
  <p class="divider"><span>{{t "or use a local account"}}</span></p>
  {{end}}
  <form method="post" action="{{base}}/login" class="stack">
    <label>{{t "Username"}} <input name="username" autocomplete="username" required {{if not (and .Data .Data.SSO)}}autofocus{{end}}></label>
    <label>{{t "Password"}} <input type="password" name="password" autocomplete="current-password" required></label>
    <button>{{t "Log in"}}</button>
  </form>
</section>
{{end}}
