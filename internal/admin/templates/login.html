{{define "content"}}
<section class="card narrow">
  <span class="brand-mark big">{{icon "tv"}}</span>
  <h1>{{.PortalName}}</h1>
  <p class="muted">Log in to the admin panel.</p>
  {{if and .Data .Data.SSO}}
  <a class="button secondary sso" href="{{base}}/login/entra">
    <svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
    Sign in with Microsoft
  </a>
  <p class="divider"><span>or use a local account</span></p>
  {{end}}
  <form method="post" action="{{base}}/login" class="stack">
    <label>Username <input name="username" autocomplete="username" required {{if not (and .Data .Data.SSO)}}autofocus{{end}}></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button>Log in</button>
  </form>
</section>
{{end}}
