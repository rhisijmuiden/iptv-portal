{{define "content"}}
<section class="card narrow">
  <h1>Wachtwoord wijzigen</h1>
  {{if .Session.Admin.MustChangePassword}}
  <p class="flash warn">Je bent ingelogd met een eenmalig wachtwoord. Kies eerst een nieuw wachtwoord om verder te gaan.</p>
  {{end}}
  <form method="post" action="/password" class="stack">
    <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
    <input type="hidden" name="username" value="{{.Session.Admin.Username}}" autocomplete="username">
    <label>Huidig wachtwoord <input type="password" name="current" autocomplete="current-password" required></label>
    <label>Nieuw wachtwoord <input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
    <label>Herhaal nieuw wachtwoord <input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
    <button>Opslaan</button>
  </form>
  {{if .Session.Admin.MustChangePassword}}
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.Session.CSRF}}"><button class="link">Uitloggen</button></form>
  {{end}}
</section>
{{end}}
