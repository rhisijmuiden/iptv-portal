{{define "content"}}
<section class="card narrow">
  <h1>{{t "Change password"}}</h1>
  {{if .Session.Admin.MustChangePassword}}
  <p class="flash warn">{{t "You logged in with a one-time password. Choose a new password to continue."}}</p>
  {{end}}
  <form method="post" action="{{base}}/password" class="stack">
    <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
    <input type="hidden" name="username" value="{{.Session.Admin.Username}}" autocomplete="username">
    <label>{{t "Current password"}} <input type="password" name="current" autocomplete="current-password" required></label>
    <label>{{t "New password"}} <input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
    <label>{{t "Repeat new password"}} <input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
    <button>{{t "Save"}}</button>
  </form>
  {{if .Session.Admin.MustChangePassword}}
  <form method="post" action="{{base}}/logout"><input type="hidden" name="csrf" value="{{.Session.CSRF}}"><button class="link">{{t "Log out"}}</button></form>
  {{end}}
</section>
{{end}}
