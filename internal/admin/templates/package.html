{{define "content"}}
{{$p := .Data.Package}}
<a class="back" href="{{base}}/packages">&larr; {{t "Packages"}}</a>
<h1>{{t .Title}}</h1>
<section class="card">
<form method="post" action="{{base}}{{if $p.ID}}/packages/{{$p.ID}}{{else}}/packages/new{{end}}" class="stack">
  <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
  <label>{{t "Name"}} <input name="name" value="{{$p.Name}}" placeholder="{{t "For example Regional"}}" required></label>
  <label class="check"><input type="checkbox" name="all_channels" {{if $p.AllChannels}}checked{{end}}> {{t "All channels and radio stations, including those added later"}}</label>
  <fieldset>
    <legend>{{t "Or only these categories"}}</legend>
    {{range .Data.Categories}}
    <label class="check"><input type="checkbox" name="category" value="{{.ID}}" {{if has $p.CategoryIDs .ID}}checked{{end}}> {{.Name}} {{if eq .Kind "radio"}}<span class="chip">{{t "Radio"}}</span> {{end}}<span class="muted">({{.ChannelCount}})</span></label>
    {{else}}
    <p class="muted">{{th `There are no categories yet. <a href="%s/categories">Add categories</a> first.` base}}</p>
    {{end}}
  </fieldset>
  <fieldset>
    <legend>{{t "On Demand"}}</legend>
    <label class="check"><input type="checkbox" name="on_demand" {{if $p.OnDemand}}checked{{end}}> {{th `Movies and series from the <a href="%s/media">media servers</a>` base}}</label>
  </fieldset>
  <label>{{t "Maximum connections per user"}} <input type="number" name="max_connections" value="{{if $p.MaxConnections}}{{$p.MaxConnections}}{{end}}" min="0" placeholder="{{t "No limit"}}">
    <small>{{t "How many places (IP addresses) a user can watch from at the same time. Leave empty for no limit. A user with several packages gets the highest limit; you can override it per user."}}</small></label>
  <div class="form-actions">
    <button>{{t "Save"}}</button>
    <a class="button secondary" href="{{base}}/packages">{{t "Cancel"}}</a>
  </div>
</form>
</section>
{{end}}
